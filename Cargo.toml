[package]
name = "embedded-nal-minimal-coapserver"
version = "0.3.0"
authors = ["chrysn <chrysn@fsfe.org>"]
edition = "2018"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/chrysn/embedded-nal-minimal-coapserver"
keywords = ["network", "coap"]
categories = ["embedded", "no-std"]
description = "A minimal CoAP server implementation built on embedded-nal"
documentation = "https://docs.rs/embedded-nal-minimal-coapserver/"

[badges]
gitlab = { repository = "chrysn/embedded-nal-minimal-coapserver" }
maintenance = { status = "experimental" }

[dependencies]
coap-message = "^0.2.0-alpha.0"
coap-handler = "^0.1.0-alpha.0"
coap-message-utils = "^0.1"
embedded-nal = "0.6"
heapless = "^0.5"
num-derive = { version = "^0.3", default-features = false }
num-traits = { version = "^0.2", default-features = false }
