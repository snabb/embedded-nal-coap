[package]
name = "embedded-nal-coap"
version = "0.1.0-alpha.5"
authors = ["chrysn <chrysn@fsfe.org>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/chrysn/embedded-nal-coap"
keywords = ["network", "coap"]
categories = ["embedded", "no-std"]
description = "A CoAP server and client implementation built on embedded-nal-async"
documentation = "https://docs.rs/embedded-nal-coap/"

[badges]
maintenance = { status = "experimental" }

[dependencies]
# parts of the interface
coap-message = "^0.3.0"
coap-handler = "^0.2.0"
coap-request = "^0.2.0-alpha.2"
embedded-nal-async = "0.9"
rand_core = { version = "0.9", default-features = false }

# internally used
heapless = "^0.9"
coap-numbers = "0.2.0"
coap-message-implementations = "0.1.4"

# It seems this is the easiest no_std "wait for either" tool around
embassy-futures = "0.1"
# ... and an easy settable flag
embassy-sync = "0.7.2"

# to provide Format on errors
defmt = { version = "0.3.8", optional = true }

[features]
defmt = ["dep:defmt", "coap-message-implementations/defmt"]
