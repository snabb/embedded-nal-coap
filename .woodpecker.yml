steps:
  build:
    image: docker.io/rust:1.88
    commands:
    - cargo version && cargo build --all
    when:
      event: [pull_request]
      path:
      - Cargo.toml
      - "src/*"
      - .woodpecker.yml

  fmt:
    image: docker.io/rust
    commands:
    - rustup component add rustfmt
    - cargo fmt --check
    when:
      event: [pull_request]
      path:
      - Cargo.toml
      - "src/*"
      - .woodpecker.yml

  lint:
    image: docker.io/rust
    commands:
    - RUSTFLAGS="-D warnings" cargo check 
    - cargo clippy -- --deny clippy::all
    when:
      event: [pull_request]
      path:
      - Cargo.toml
      - "src/*"
      - .woodpecker.yml
    failure: ignore

  readme:
    image: codeberg.org/msrd0/cargo-doc2readme
    commands:
    - cargo doc2readme --check
    when:
      event: [pull_request]
      path:
        - README.md
        - src/lib.rs
        - Cargo.toml
        - .woodpecker.yml
