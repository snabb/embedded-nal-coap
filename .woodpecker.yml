steps:
  build:
    image: docker.io/rust:1.79
    commands:
    - cargo version && cargo build --all
    when:
      path: "src/*"

  fmt:
    image: docker.io/rust
    commands:
    - rustup component add rustfmt
    - cargo fmt --check
    when:
      path: "src/*"

  lint:
    image: docker.io/rust
    commands:
    - RUSTFLAGS="-D warnings" cargo check 
    - cargo clippy -- --deny clippy::all
    when:
      path: "src/*"
    failure: ignore

  readme:
    image: docker.io/rust
    commands:
    - cargo install cargo-readme
    - cargo readme | diff /dev/stdin README.md
    when:
      path:
        - README.md
        - src/lib.rs
