steps:
  env:
    image: docker.io/bash
    commands:
    - echo export CARGO_TERM_COLOR=always > envvars
    - echo export GIT_CONFIG_PARAMETERS="'color.ui=always'"
    when:
      - event: pull_request
      - event: push
        branch: main

  build:
    image: docker.io/rust:1.88
    depends_on: [env]
    commands:
    - . ./envvars
    - cargo version && cargo build --all
    when:
      - event: pull_request
        path:
          - Cargo.toml
          - "src/*"
          - .woodpecker.yml
      - event: push
        branch: main

  fmt:
    image: docker.io/rust
    depends_on: [env]
    commands:
    - . ./envvars
    - rustup component add rustfmt
    - cargo fmt --check
    when:
      - event: pull_request
        path:
          - Cargo.toml
          - "src/*"
          - .woodpecker.yml
      - event: push
        branch: main

  lint:
    image: docker.io/rust
    depends_on: [env]
    commands:
    - . ./envvars
    - rustup component add clippy
    - RUSTFLAGS="-D warnings" cargo check --all-targets
    - cargo clippy --all-targets -- --deny clippy::all
    - RUSTDOCFLAGS="-D warnings" cargo +nightly doc --all-features --no-deps
    when:
      - event: pull_request
        path:
          - Cargo.toml
          - "src/*"
          - .woodpecker.yml
      - event: push
        branch: main
    failure: ignore

  readme:
    image: codeberg.org/msrd0/cargo-doc2readme
    commands:
    - cargo doc2readme --check
    when:
      - event: pull_request
        path:
          - README.md
          - src/lib.rs
          - Cargo.toml
          - .woodpecker.yml
      - event: push
        branch: main
