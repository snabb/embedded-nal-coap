steps:
  build:
    image: docker.io/rust:1.88
    commands:
    - cargo version && cargo build --all
    when:
      event: [pull_request]
      path:
      - Cargo.toml
      - "src/*"
      - .woodpecker.yml

  fmt:
    image: docker.io/rust
    commands:
    - rustup component add rustfmt
    - cargo fmt --check
    when:
      event: [pull_request]
      path:
      - "src/*"
      - .woodpecker.yml

  lint:
    image: docker.io/rust
    commands:
    - RUSTFLAGS="-D warnings" cargo check 
    - cargo clippy -- --deny clippy::all
    when:
      event: [pull_request]
      path:
      - "src/*"
      - .woodpecker.yml
    failure: ignore

  readme:
    image: docker.io/rust
    commands:
    - cargo install cargo-readme
    - cargo readme | diff /dev/stdin README.md
    when:
      event: [pull_request]
      path:
        - README.md
        - src/lib.rs
        - .woodpecker.yml
