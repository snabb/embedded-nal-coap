steps:
  build:
    # switch to docker.io/rust:latest once 1.75 is out (and consider adding an MSRV check)
    image: docker.io/rustlang/rust:nightly
    commands:
    - cargo version && cargo build --all
    when:
      path: "src/*"

  fmt:
    image: docker.io/rustlang/rust:nightly
    commands:
    - cargo fmt --check
    when:
      path: "src/*"

  lint:
    image: docker.io/rustlang/rust:nightly
    commands:
    - RUSTFLAGS="-D warnings" cargo check 
    - cargo clippy -- --deny clippy::all
    when:
      path: "src/*"
    failure: ignore

  readme:
    image: docker.io/rustlang/rust:nightly
    commands:
    - cargo install cargo-readme
    - cargo readme | diff /dev/stdin README.md
    when:
      path:
        - README.md
        - src/lib.rs
